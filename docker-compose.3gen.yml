# 3Gen Robotics deployment (Coolify on newbackyard, https://3gentasks.bearswithapps.com;
# later also https://tasks.3genrobotics.com). Same fork and branch as the BearsWithApps
# deployment (docker-compose.bwapps.yml), but its own database, secrets and storage.
# Required Coolify env vars:
#   BASE_URL, POSTGRES_PASSWORD, SECRET_KEY,
#   DEFAULT_ADMIN_EMAIL, DEFAULT_ADMIN_PASSWORD, DEFAULT_ADMIN_NAME, DEFAULT_ADMIN_USERNAME,
#   GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY (3Gen Garage key `planka`, bucket 3gen-planka-uploads)
# Uploads (attachments, avatars, backgrounds) go to the 3Gen Garage over its internal docker
# network (service 3gens3.bearswithapps.com); Planka streams them to browsers itself.
# Domain is assigned to the `planka` service (port 1337) in Coolify.
# No db-backup sidecar yet: the BearsWithApps one writes to the BearsWithApps AWS bucket and
# must not hold 3Gen data. Add a 3Gen-owned backup target before relying on this for real work.
services:
  planka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - planka-3gen-data:/app/data
    environment:
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=postgresql://planka:${POSTGRES_PASSWORD}@postgres/planka
      - SECRET_KEY=${SECRET_KEY}
      - TRUST_PROXY=true
      - LOG_LEVEL=warn
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-3Gen Admin}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      # Visible name and images (3Gen branding; logo from 3genrobotics.com).
      - PRODUCT_NAME=${PRODUCT_NAME:-3Gen Tasks}
      - PRODUCT_DESCRIPTION=${PRODUCT_DESCRIPTION:-3Gen Tasks is the kanban board for 3Gen Robotics}
      - PRODUCT_LOGO_URL=${PRODUCT_LOGO_URL:-https://3genfiles.bearswithapps.com/branding/logo.png}
      - PRODUCT_COVER_URL=${PRODUCT_COVER_URL:-https://3genfiles.bearswithapps.com/branding/login-cover.jpg}
      - SHOW_PROMO_BANNER=${SHOW_PROMO_BANNER:-false}
      - S3_ENDPOINT=http://garage:3900
      - S3_REGION=garage
      - S3_BUCKET=3gen-planka-uploads
      - S3_FORCE_PATH_STYLE=true
      - S3_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${GARAGE_SECRET_ACCESS_KEY}
    networks:
      - default
      - garage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - planka-3gen-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_USER=planka
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planka -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  planka-3gen-data:
  planka-3gen-db:

networks:
  garage:
    external: true
    name: oqikuux356sz9o6mmbravhdg
